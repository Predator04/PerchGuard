plugins {
    id 'com.android.application'
}

repositories {
    google()
    mavenCentral()
}

def apiProps = new Properties()
def apiPropsFile = rootProject.file('apikey.properties')
if (apiPropsFile.exists()) { apiProps.load(apiPropsFile.newDataInputStream()) }
def authToken = apiProps.getProperty('AUTH_TOKEN', '')

android {
    namespace 'com.perchguard.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.perchguard.app"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "0.6.0"
        buildConfigField "int",    "VERSION_CODE",        "6"
        buildConfigField "String", "VERSION_NAME",        "\"0.6.0\""
        buildConfigField "String", "GH_REPO",             "\"Predator04/PerchGuard\""
        buildConfigField "String", "UPDATE_ASSET_PREFIX", "\"PerchGuard-child-v\""
        buildConfigField "String", "AUTH_TOKEN", "\"${authToken}\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
